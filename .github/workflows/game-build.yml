name: Build TukTuk Escape APK

on:
  workflow_dispatch:

jobs:
  build-android:

    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "build-tools;35.0.1" \
            "platforms;android-35" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      - name: Download Godot 4.7.2
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/godot"

          wget -q \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            -O /tmp/godot.zip

          unzip -q /tmp/godot.zip -d "$HOME/godot"

          GODOT_BIN=$(find "$HOME/godot" -type f -name "Godot_v4.7.2-stable_linux.x86_64" | head -1)

          if [ -z "$GODOT_BIN" ]; then
            echo "Godot executable not found."
            find "$HOME/godot" -maxdepth 3 -type f
            exit 1
          fi

          chmod +x "$GODOT_BIN"

          echo "GODOT=$GODOT_BIN" >> "$GITHUB_ENV"

          "$GODOT_BIN" --version

      - name: Install Godot Android Export Templates
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.local/share/godot/export_templates"

          wget -q \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz" \
            -O /tmp/templates.tpz

          rm -rf /tmp/godot_templates
          mkdir -p /tmp/godot_templates

          unzip -q /tmp/templates.tpz -d /tmp/godot_templates

          TEMPLATE_DIR=$(find /tmp/godot_templates \
            -type d \
            -name "4.7.2.stable" \
            | head -1)

          if [ -z "$TEMPLATE_DIR" ]; then
            echo "Godot export templates were not found."

            find /tmp/godot_templates \
              -maxdepth 5 \
              -type f

            exit 1
          fi

          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"

          cp -a "$TEMPLATE_DIR"/. \
            "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

          echo "=== Android Templates ==="

          ls -lh \
            "$HOME/.local/share/godot/export_templates/4.7.2.stable"

      - name: Configure Godot Android
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]

          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF

          echo "=== Java ==="
          java -version

          echo "=== Android SDK ==="
          echo "$ANDROID_HOME"

          ls -la "$ANDROID_HOME"

      - name: Extract Game
        shell: bash
        run: |
          set -e

          if [ ! -f "TukTukEscape-first-version.zip" ]; then
            echo "TukTukEscape-first-version.zip was not found."
            exit 1
          fi

          rm -rf game
          rm -rf /tmp/tuktuk

          mkdir -p /tmp/tuktuk
          mkdir -p game/TukTukEscape

          unzip -o \
            "TukTukEscape-first-version.zip" \
            -d /tmp/tuktuk

          if [ -d "/tmp/tuktuk/game/TukTukEscape" ]; then

            cp -a \
              /tmp/tuktuk/game/TukTukEscape/. \
              game/TukTukEscape/

          elif [ -d "/tmp/tuktuk/TukTukEscape" ]; then

            cp -a \
              /tmp/tuktuk/TukTukEscape/. \
              game/TukTukEscape/

          else

            echo "Could not find the game inside the ZIP."

            find /tmp/tuktuk \
              -maxdepth 5 \
              -type f

            exit 1
          fi

          echo "=== GAME FILES ==="

          find game/TukTukEscape \
            -maxdepth 4 \
            -type f \
            | sort

      - name: Create Android Export Preset
        shell: bash
        run: |
          set -e

          cd game/TukTukEscape

          cat > export_presets.cfg <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/TukTukEscape.apk"
          patches=PackedStringArray()
          encryption_include_filters=""
          encryption_exclude_filters=""
          seed=0
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""

          gradle_build/use_gradle_build=false
          gradle_build/gradle_build_directory=""
          gradle_build/android_source_template=""
          gradle_build/compress_native_libraries=false
          gradle_build/export_format=0
          gradle_build/min_sdk=""
          gradle_build/target_sdk=""
          gradle_build/custom_theme_attributes={}

          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false

          version/code=1
          version/name="1.0"

          package/unique_name="com.mohfjc.tuktukescape"
          package/name="TukTuk Escape"
          package/signed=true

          package/app_category=2
          package/retain_data_on_uninstall=false
          package/exclude_from_recents=false
          package/show_in_android_tv=false
          package/show_in_app_library=true
          package/show_as_launcher_app=true

          launcher_icons/main_192x192=""

          launcher_icons/adaptive_foreground_432x432=""
          launcher_icons/adaptive_background_432x432=""
          launcher_icons/adaptive_monochrome_432x432=""

          graphics/opengl_debug=false

          xr_features/xr_mode=0

          screen/immersive_mode=true
          screen/edge_to_edge=false
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true

          user_data_backup/allow=false

          command_line/extra_args=""

          apk_expansion/enable=false

          permissions/custom_permissions=PackedStringArray()

          keystore/debug=""
          keystore/debug_user=""
          keystore/debug_password=""

          keystore/release=""
          keystore/release_user=""
          keystore/release_password=""

          one_click_deploy/clear_previous_install=false
          EOF

          echo "=== EXPORT PRESET ==="
          cat export_presets.cfg

      - name: Validate Godot Project
        shell: bash
        run: |
          set -e

          cd game/TukTukEscape

          "$GODOT" \
            --headless \
            --path . \
            --editor \
            --quit

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd game/TukTukEscape

          mkdir -p build

          echo "=== STARTING ANDROID BUILD ==="

          "$GODOT" \
            --headless \
            --verbose \
            --path . \
            --export-debug \
            "Android" \
            "build/TukTukEscape.apk"

          echo "=== BUILD FINISHED ==="

          ls -lh build/

      - name: Check APK
        shell: bash
        run: |
          set -e

          if [ ! -f "game/TukTukEscape/build/TukTukEscape.apk" ]; then
            echo "APK was not created."
            exit 1
          fi

          echo "APK successfully created."

          ls -lh \
            game/TukTukEscape/build/TukTukEscape.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TukTukEscape-APK
          path: game/TukTukEscape/build/TukTukEscape.apk
