name: Build TukTuk Escape APK

on:
  workflow_dispatch:

jobs:
  build-android:

    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "build-tools;35.0.1" \
            "platforms;android-35"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Download Godot 4.7.2
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/godot"

          wget -q \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            -O /tmp/godot.zip

          unzip -q /tmp/godot.zip -d "$HOME/godot"

          GODOT_BIN=$(find "$HOME/godot" \
            -type f \
            -name "Godot_v4.7.2-stable_linux.x86_64" \
            | head -1)

          if [ -z "$GODOT_BIN" ]; then
            echo "ERROR: Godot executable not found."
            find "$HOME/godot" -maxdepth 3 -type f
            exit 1
          fi

          chmod +x "$GODOT_BIN"

          echo "GODOT=$GODOT_BIN" >> "$GITHUB_ENV"

          "$GODOT_BIN" --version

      - name: Install Godot Export Templates
        shell: bash
        run: |
          set -e

          echo "=== Downloading export templates ==="

          wget -q \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz" \
            -O /tmp/templates.tpz

          rm -rf /tmp/godot_templates
          mkdir -p /tmp/godot_templates

          unzip -q \
            /tmp/templates.tpz \
            -d /tmp/godot_templates

          echo "=== Downloaded templates ==="

          find /tmp/godot_templates \
            -maxdepth 3 \
            -type f \
            | sort

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.7.2.stable"

          rm -rf "$TEMPLATE_DIR"
          mkdir -p "$TEMPLATE_DIR"

          cp -a \
            /tmp/godot_templates/templates/. \
            "$TEMPLATE_DIR/"

          echo "4.7.2.stable" > "$TEMPLATE_DIR/version.txt"

          echo "=== Installed templates ==="

          ls -lh "$TEMPLATE_DIR"

          if [ ! -f "$TEMPLATE_DIR/android_debug.apk" ]; then
            echo "ERROR: android_debug.apk not found."
            exit 1
          fi

          if [ ! -f "$TEMPLATE_DIR/android_release.apk" ]; then
            echo "ERROR: android_release.apk not found."
            exit 1
          fi

          echo "android_debug.apk FOUND"
          echo "android_release.apk FOUND"

      - name: Extract Game
        shell: bash
        run: |
          set -e

          if [ ! -f "TukTukEscape-first-version.zip" ]; then
            echo "ERROR: TukTukEscape-first-version.zip not found."
            exit 1
          fi

          rm -rf game
          rm -rf /tmp/tuktuk

          mkdir -p /tmp/tuktuk
          mkdir -p game/TukTukEscape

          unzip -o \
            "TukTukEscape-first-version.zip" \
            -d /tmp/tuktuk

          if [ -d "/tmp/tuktuk/game/TukTukEscape" ]; then

            cp -a \
              /tmp/tuktuk/game/TukTukEscape/. \
              game/TukTukEscape/

          elif [ -d "/tmp/tuktuk/TukTukEscape" ]; then

            cp -a \
              /tmp/tuktuk/TukTukEscape/. \
              game/TukTukEscape/

          else

            echo "ERROR: TukTukEscape folder was not found."

            find /tmp/tuktuk \
              -maxdepth 5 \
              -type f

            exit 1
          fi

          echo "=== Game files ==="

          find game/TukTukEscape \
            -maxdepth 4 \
            -type f \
            | sort

      - name: Enable Android Texture Compression
        shell: bash
        run: |
          set -e

          cd game/TukTukEscape

          if [ ! -f "project.godot" ]; then
            echo "ERROR: project.godot not found."
            exit 1
          fi

          echo "=== Enabling ETC2/ASTC ==="

          if grep -q \
            "textures/vram_compression/import_etc2_astc" \
            project.godot; then

            sed -i \
              's|textures/vram_compression/import_etc2_astc.*|textures/vram_compression/import_etc2_astc=true|' \
              project.godot

          else

            cat >> project.godot <<'EOF'

[rendering]

textures/default_filters/use_nearest_mipmap_filter=false
textures/canvas_textures/default_texture_filter=0
textures/vram_compression/import_etc2_astc=true
EOF

          fi

          echo "=== Checking project setting ==="

          grep \
            "import_etc2_astc" \
            project.godot || true

      - name: Create Debug Keystore
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.local/share/godot/keystores"

          keytool \
            -genkeypair \
            -v \
            -keystore "$HOME/.local/share/godot/keystores/debug.keystore" \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

          echo "DEBUG_KEYSTORE=$HOME/.local/share/godot/keystores/debug.keystore" >> "$GITHUB_ENV"

      - name: Initialize Godot
        shell: bash
        run: |
          set -e

          cd game/TukTukEscape

          "$GODOT" \
            --headless \
            --path . \
            --editor \
            --quit

          echo "=== Godot initialized ==="

      - name: Configure Godot Android
        shell: bash
        run: |
          set -e

          SETTINGS="$HOME/.config/godot/editor_settings-4.7.tres"

          if [ ! -f "$SETTINGS" ]; then
            echo "ERROR: Godot editor settings were not created."

            find "$HOME/.config/godot" \
              -maxdepth 2 \
              -type f || true

            exit 1
          fi

          echo "=== Configuring Android paths ==="

          if grep -q "export/android/java_sdk_path" "$SETTINGS"; then
            sed -i \
              "s|export/android/java_sdk_path.*|export/android/java_sdk_path = \"$JAVA_HOME\"|" \
              "$SETTINGS"
          else
            echo "export/android/java_sdk_path = \"$JAVA_HOME\"" >> "$SETTINGS"
          fi

          if grep -q "export/android/android_sdk_path" "$SETTINGS"; then
            sed -i \
              "s|export/android/android_sdk_path.*|export/android/android_sdk_path = \"$ANDROID_HOME\"|" \
              "$SETTINGS"
          else
            echo "export/android/android_sdk_path = \"$ANDROID_HOME\"" >> "$SETTINGS"
          fi

          if grep -q "export/android/debug_keystore" "$SETTINGS"; then
            sed -i \
              "s|export/android/debug_keystore.*|export/android/debug_keystore = \"$DEBUG_KEYSTORE\"|" \
              "$SETTINGS"
          else
            echo "export/android/debug_keystore = \"$DEBUG_KEYSTORE\"" >> "$SETTINGS"
          fi

          if grep -q "export/android/debug_keystore_user" "$SETTINGS"; then
            sed -i \
              "s|export/android/debug_keystore_user.*|export/android/debug_keystore_user = \"androiddebugkey\"|" \
              "$SETTINGS"
          else
            echo "export/android/debug_keystore_user = \"androiddebugkey\"" >> "$SETTINGS"
          fi

          if grep -q "export/android/debug_keystore_pass" "$SETTINGS"; then
            sed -i \
              "s|export/android/debug_keystore_pass.*|export/android/debug_keystore_pass = \"android\"|" \
              "$SETTINGS"
          else
            echo "export/android/debug_keystore_pass = \"android\"" >> "$SETTINGS"
          fi

          echo "=== Android settings ==="

          grep "export/android/" "$SETTINGS" || true

      - name: Create Android Export Preset
        shell: bash
        run: |
          set -e

          cd game/TukTukEscape

          python3 - <<'PY'
          preset = '''[preset.0]

          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/TukTukEscape.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""

          gradle_build/use_gradle_build=false
          gradle_build/export_format=0

          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false

          version/code=1
          version/name="1.0"

          package/unique_name="com.mohfjc.tuktukescape"
          package/name="TukTuk Escape"
          package/signed=true

          package/app_category=2
          package/retain_data_on_uninstall=false
          package/exclude_from_recents=false
          package/show_in_android_tv=false
          package/show_as_launcher_app=true
          package/show_in_app_library=true

          launcher_icons/main_192x192=""
          launcher_icons/adaptive_foreground_432x432=""
          launcher_icons/adaptive_background_432x432=""

          graphics/opengl_debug=false

          xr_features/xr_mode=0

          screen/immersive_mode=true
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true

          user_data_backup/allow=false

          command_line/extra_args=""

          apk_expansion/enable=false

          permissions/custom_permissions=PackedStringArray()

          keystore/debug=""
          keystore/debug_user=""
          keystore/debug_password=""

          keystore/release=""
          keystore/release_user=""
          keystore/release_password=""

          one_click_deploy/clear_previous_install=false
          '''

          with open("export_presets.cfg", "w") as f:
              f.write(preset.lstrip())
          PY

          echo "=== Export preset ==="
          cat export_presets.cfg

      - name: Validate Project
        shell: bash
        run: |
          set -e

          cd game/TukTukEscape

          "$GODOT" \
            --headless \
            --path . \
            --editor \
            --quit

          echo "=== Project validation completed ==="

      - name: Build Android APK
        shell: bash
        run: |
          set -e

          cd game/TukTukEscape

          mkdir -p build

          echo "=== STARTING ANDROID EXPORT ==="

          "$GODOT" \
            --headless \
            --verbose \
            --path . \
            --export-debug \
            "Android" \
            "build/TukTukEscape.apk"

          echo "=== APK BUILD COMPLETE ==="

          ls -lh build/

      - name: Check APK
        shell: bash
        run: |
          set -e

          APK="game/TukTukEscape/build/TukTukEscape.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "================================"
          echo "APK CREATED SUCCESSFULLY"
          echo "================================"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TukTukEscape-APK
          path: game/TukTukEscape/build/TukTukEscape.apk
