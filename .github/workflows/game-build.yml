name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "TukTukEscape-first-version.zip"
      - ".github/workflows/game-build.yml"
      - "game/**"

jobs:
  setup-and-build:
    runs-on: ubuntu-24.04

    container:
      image: barichello/godot-ci:4.6.3

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot Android
        shell: bash
        run: |
          set -e

          echo "=== Java ==="
          java -version

          echo "=== Android SDK ==="
          ls -la /usr/lib/android-sdk

          echo "=== Godot Export Templates ==="
          ls -la /root/.local/share/godot/export_templates/ || true

          mkdir -p "$HOME/.config"
          mkdir -p "$HOME/.local/share/godot/export_templates"

          if [ -d "/root/.config/godot" ]; then
            rm -rf "$HOME/.config/godot"
            cp -a /root/.config/godot "$HOME/.config/godot"
          fi

          if [ -d "/root/.local/share/godot/export_templates/4.6.3.stable" ]; then
            rm -rf "$HOME/.local/share/godot/export_templates/4.6.3.stable"
            cp -a \
              /root/.local/share/godot/export_templates/4.6.3.stable \
              "$HOME/.local/share/godot/export_templates/4.6.3.stable"
          else
            echo "ERROR: Export templates not found."
            exit 1
          fi

      - name: Extract Game
        shell: bash
        run: |
          set -e

          rm -rf game/TukTukEscape
          mkdir -p game/TukTukEscape

          if [ ! -f "TukTukEscape-first-version.zip" ]; then
            echo "ERROR: ZIP file not found."
            exit 1
          fi

          rm -rf /tmp/tuktuk
          mkdir -p /tmp/tuktuk

          unzip -o "TukTukEscape-first-version.zip" -d /tmp/tuktuk

          if [ -d "/tmp/tuktuk/game/TukTukEscape" ]; then
            cp -a /tmp/tuktuk/game/TukTukEscape/. game/TukTukEscape/
          elif [ -d "/tmp/tuktuk/TukTukEscape" ]; then
            cp -a /tmp/tuktuk/TukTukEscape/. game/TukTukEscape/
          else
            echo "ERROR: Game folder not found."
            find /tmp/tuktuk -maxdepth 4 -type f
            exit 1
          fi

          echo "=== GAME FILES ==="
          find game/TukTukEscape -maxdepth 3 -type f | sort

      - name: Create Android Export Preset
        shell: bash
        run: |
          set -e

          cd game/TukTukEscape

          echo "=== Creating export_presets.cfg ==="

          echo '' | base64 -d > export_presets.cfg

          echo "=== Export preset created ==="
          cat export_presets.cfg

      - name: Validate Project
        shell: bash
        run: |
          set -e

          cd game/TukTukEscape

          godot \
            --headless \
            --path . \
            --editor \
            --quit

      - name: Build Android APK
        shell: bash
        run: |
          set -e

          cd game/TukTukEscape

          mkdir -p ../../build/android

          echo "=== BUILDING APK ==="

          godot \
            --headless \
            --verbose \
            --path . \
            --export-debug \
            "Android Debug" \
            "../../build/android/TukTukEscape-debug.apk"

          echo "=== BUILD COMPLETE ==="

          ls -lh ../../build/android/

      - name: Check APK
        shell: bash
        run: |
          set -e

          if [ ! -f "build/android/TukTukEscape-debug.apk" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "=== APK SUCCESS ==="
          ls -lh build/android/TukTukEscape-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TukTukEscape-Android
          path: build/android/TukTukEscape-debug.apk
